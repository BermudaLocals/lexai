<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LexAI Vault</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background:#0b0b0f; color:#eee; }
  h1 { font-weight: 600; }
  .drop { border: 2px dashed #444; border-radius: 10px; padding: 30px; text-align: center; margin-bottom: 24px; }
  input[type=file] { margin-top: 10px; }
  button { background:#5b5bf0; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; }
  button.danger { background:#e0455b; }
  table { width:100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #2a2a33; }
  .type-tag { font-size:12px; background:#232333; padding:2px 8px; border-radius:12px; }
  .empty { color:#888; font-size:14px; margin-top:10px; }
</style>
<!-- LexAI IP Protection -->
<meta name="copyright" content="© 2026 LexAI. All rights reserved.">
<meta name="lexai-fingerprint" content="LEXAI-V3.0.0-20260817">
<script>
(function() {
  const watermark = document.createElement("div");
  watermark.style.cssText = "position:fixed;bottom:0;right:0;font-size:8px;opacity:0.05;z-index:9999;pointer-events:none";
  watermark.textContent = "© 2026 LexAI. All rights reserved.";
  document.body.appendChild(watermark);
})();
</script>
<!-- End IP Protection -->
</head>
<body>
  <h1>Vault</h1>
  <div class="drop">
    <p>Upload a Spellbook, Word doc, or PDF</p>
    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.spellbook,.txt" />
    <br><br>
    <button onclick="uploadFile()">Upload</button>
  </div>
  <table>
    <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Uploaded</th><th></th></tr></thead>
    <tbody id="fileList"></tbody>
  </table>
  <p class="empty" id="emptyMsg" style="display:none;">No files yet.</p>

<script>
async function loadFiles() {
  const res = await fetch('/api/vault/files');
  if (res.status === 401) {
    document.body.innerHTML = '<p style="padding:40px;text-align:center;">Please <a href="/login" style="color:#8b8bff;">log in</a> to view your Vault.</p>';
    return;
  }
  const data = await res.json();
  const tbody = document.getElementById('fileList');
  const emptyMsg = document.getElementById('emptyMsg');
  tbody.innerHTML = '';
  const files = data.files || [];
  emptyMsg.style.display = files.length ? 'none' : 'block';
  files.forEach(f => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${escapeHtml(f.original_name)}</td>
      <td><span class="type-tag">${escapeHtml(f.type)}</span></td>
      <td>${(f.size/1024).toFixed(1)} KB</td>
      <td>${new Date(f.created_at).toLocaleDateString()}</td>
      <td>
        <button onclick="downloadFile(${f.id})">Download</button>
        <button class="danger" onclick="deleteFile(${f.id})">Delete</button>
      </td>`;
    tbody.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function uploadFile() {
  const input = document.getElementById('fileInput');
  if (!input.files.length) return alert('Choose a file first');
  const formData = new FormData();
  formData.append('file', input.files[0]);
  const res = await fetch('/api/vault/upload', { method: 'POST', body: formData });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    return alert(err.error || 'Upload failed');
  }
  input.value = '';
  loadFiles();
}

function downloadFile(id) {
  window.location.href = `/api/vault/download/${id}`;
}

async function deleteFile(id) {
  if (!confirm('Delete this file?')) return;
  await fetch(`/api/vault/${id}`, { method: 'DELETE' });
  loadFiles();
}

loadFiles();
</script>
</body>
</html>
