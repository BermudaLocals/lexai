<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>LexAI Vault</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    background: #0b0b0f;
    color: #eee;
  }
  h1 {
    font-weight: 700;
    font-size: 22px;
    margin: 8px 0 4px;
  }
  .subtitle {
    color: #999;
    font-size: 14px;
    margin: 0 0 20px;
  }
  .upload-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .upload-btn.primary {
    background: #5b5bf0;
    color: #fff;
  }
  .upload-btn.secondary {
    background: #1a1a22;
    color: #eee;
    border: 1px solid #333;
  }
  .upload-btn:active { opacity: 0.85; }
  .upload-btn .icon { font-size: 20px; }
  input[type=file] { display: none; }
  .status-msg {
    font-size: 13px;
    color: #8b8bff;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }
  .status-msg.error { color: #ff8b8b; }
  h2.section {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin: 24px 0 10px;
  }
  .file-card {
    background: #16161d;
    border: 1px solid #2a2a33;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .file-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .file-name {
    font-size: 15px;
    font-weight: 500;
    word-break: break-word;
    flex: 1;
  }
  .type-tag {
    font-size: 11px;
    background: #232333;
    color: #a8a8ff;
    padding: 3px 9px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .meta-row {
    font-size: 12px;
    color: #888;
  }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .action-row button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .action-row .download-btn { background: #232333; color: #eee; }
  .action-row .danger { background: #3a1a1e; color: #ff8b8b; }
  .empty {
    color: #888;
    font-size: 14px;
    text-align: center;
    padding: 30px 20px;
    background: #16161d;
    border-radius: 12px;
    border: 1px dashed #333;
  }
  .login-msg {
    text-align: center;
    padding: 60px 20px;
    font-size: 15px;
  }
  .login-msg a { color: #8b8bff; }
</style>
<!-- LexAI IP Protection -->
<meta name="copyright" content="© 2026 LexAI. All rights reserved.">
<meta name="lexai-fingerprint" content="LEXAI-V3.0.0-20260817">
<script>
(function() {
  const watermark = document.createElement("div");
  watermark.style.cssText = "position:fixed;bottom:0;right:0;font-size:8px;opacity:0.05;z-index:9999;pointer-events:none";
  watermark.textContent = "© 2026 LexAI. All rights reserved.";
  document.body.appendChild(watermark);
})();
</script>
<!-- End IP Protection -->
</head>
<body>
  <h1>Vault</h1>
  <p class="subtitle">Take a photo or upload a document — LexAI can read and explain either.</p>

  <div class="upload-row">
    <button class="upload-btn primary" onclick="document.getElementById('cameraInput').click()">
      <span class="icon">📷</span> Take Photo
    </button>
    <button class="upload-btn secondary" onclick="document.getElementById('galleryInput').click()">
      <span class="icon">🖼️</span> Choose from Gallery
    </button>
    <button class="upload-btn secondary" onclick="document.getElementById('fileInput').click()">
      <span class="icon">📄</span> Upload a File
    </button>
  </div>

  <!-- capture="environment" sends the browser straight into the camera app,
       no chooser dialog in between -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleUpload(this, true)" />

  <!-- accept=image/* with no capture attribute opens the photo library/gallery directly -->
  <input type="file" id="galleryInput" accept="image/*" onchange="handleUpload(this, true)" />

  <!-- Dedicated document input for PDFs, Word docs, spellbooks, text files -->
  <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.spellbook,.txt" onchange="handleUpload(this, false)" />

  <p class="status-msg" id="statusMsg"></p>

  <h2 class="section">Your Files</h2>
  <div id="fileList"></div>
  <p class="empty" id="emptyMsg" style="display:none;">No files yet. Scan a contract or upload a document above to get started.</p>

<script>
function setStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg || '';
  el.className = 'status-msg' + (isError ? ' error' : '');
}

async function loadFiles() {
  const res = await fetch('/api/vault/files');
  if (res.status === 401) {
    document.body.innerHTML = '<p class="login-msg">Please <a href="/login">log in</a> to view your Vault.</p>';
    return;
  }
  const data = await res.json();
  const list = document.getElementById('fileList');
  const emptyMsg = document.getElementById('emptyMsg');
  list.innerHTML = '';
  const files = data.files || [];
  emptyMsg.style.display = files.length ? 'none' : 'block';

  files.forEach(f => {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.innerHTML = `
      <div class="top-row">
        <span class="file-name">${escapeHtml(f.original_name)}</span>
        <span class="type-tag">${escapeHtml(f.type)}</span>
      </div>
      <div class="meta-row">${(f.size/1024).toFixed(1)} KB · ${new Date(f.created_at).toLocaleDateString()}</div>
      <div class="action-row">
        <button class="download-btn" onclick="downloadFile(${f.id})">Download</button>
        <button class="danger" onclick="deleteFile(${f.id})">Delete</button>
      </div>`;
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function handleUpload(input, isScan) {
  if (!input.files.length) return;
  const file = input.files[0];
  setStatus('Uploading ' + file.name + '...');
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/vault/upload', { method: 'POST', body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      setStatus(err.error || 'Upload failed', true);
      input.value = '';
      return;
    }
    const data = await res.json();
    if (isScan && data.file && data.file.id) {
      setStatus('Reading ' + file.name + '...');
      const extractRes = await fetch('/api/vault/extract/' + data.file.id);
      const extractData = await extractRes.json();
      if (extractData.error) {
        setStatus(extractData.error, true);
        loadFiles();
        input.value = '';
        return;
      }
      sessionStorage.setItem('lexai_scan_result', JSON.stringify({
        text: extractData.text,
        filename: extractData.filename
      }));
      setStatus('Opening analysis...');
      window.location.href = '/dashboard.html';
      return;
    }
    setStatus('Uploaded ' + file.name);
    loadFiles();
  } catch (e) {
    setStatus('Upload failed — check your connection', true);
  }
  input.value = '';
}

function downloadFile(id) {
  window.location.href = `/api/vault/download/${id}`;
}

async function deleteFile(id) {
  if (!confirm('Delete this file?')) return;
  await fetch(`/api/vault/${id}`, { method: 'DELETE' });
  loadFiles();
}

loadFiles();
</script>
</body>
</html>
