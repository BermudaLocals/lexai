<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>LexAI Vault</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    background: #0b0b0f;
    color: #eee;
    transition: background 0.15s, outline 0.15s;
    outline: 3px dashed transparent;
    outline-offset: -3px;
  }
  body.drag-over {
    background: #12121d;
    outline-color: #5b5bf0;
  }
  body.drag-over::after {
    content: "Drop to upload";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #8b8bff;
    background: rgba(11,11,15,0.85);
    z-index: 999;
    pointer-events: none;
  }
  h1 {
    font-weight: 700;
    font-size: 22px;
    margin: 8px 0 4px;
  }
  .subtitle {
    color: #999;
    font-size: 14px;
    margin: 0 0 20px;
  }
  .upload-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .upload-btn.primary {
    background: #5b5bf0;
    color: #fff;
  }
  .upload-btn.secondary {
    background: #1a1a22;
    color: #eee;
    border: 1px solid #333;
  }
  .upload-btn:active { opacity: 0.85; }
  .upload-btn .icon { font-size: 20px; }
  input[type=file] { display: none; }
  .status-msg {
    font-size: 13px;
    color: #8b8bff;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }
  .status-msg.error { color: #ff8b8b; }
  h2.section {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin: 24px 0 10px;
  }
  .file-card {
    background: #16161d;
    border: 1px solid #2a2a33;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .file-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .file-name {
    font-size: 15px;
    font-weight: 500;
    word-break: break-word;
    flex: 1;
  }
  .type-tag {
    font-size: 11px;
    background: #232333;
    color: #a8a8ff;
    padding: 3px 9px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .meta-row {
    font-size: 12px;
    color: #888;
  }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .action-row button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .action-row .download-btn { background: #232333; color: #eee; }
  .action-row .danger { background: #3a1a1e; color: #ff8b8b; }
  .empty {
    color: #888;
    font-size: 14px;
    text-align: center;
    padding: 30px 20px;
    background: #16161d;
    border-radius: 12px;
    border: 1px dashed #333;
  }
  .login-msg {
    text-align: center;
    padding: 60px 20px;
    font-size: 15px;
  }
  .login-msg a { color: #8b8bff; }
</style>
<!-- LexAI IP Protection -->
<meta name="copyright" content="© 2026 LexAI. All rights reserved.">
<meta name="lexai-fingerprint" content="LEXAI-V3.0.0-20260817">
<script>
(function() {
  const watermark = document.createElement("div");
  watermark.style.cssText = "position:fixed;bottom:0;right:0;font-size:8px;opacity:0.05;z-index:9999;pointer-events:none";
  watermark.textContent = "© 2026 LexAI. All rights reserved.";
  document.body.appendChild(watermark);
})();
</script>
<!-- End IP Protection -->
</head>
<body>
  <h1>Vault</h1>
  <p class="subtitle">Take a photo or upload a document — LexAI can read and explain either.</p>

  <div class="upload-row">
    <button class="upload-btn primary" id="takePhotoBtn" onclick="document.getElementById('cameraInput').click()">
      <span class="icon">📷</span> Take Photo
    </button>
    <button class="upload-btn secondary" id="galleryBtn" onclick="document.getElementById('galleryInput').click()">
      <span class="icon">🖼️</span> Choose from Gallery
    </button>
    <button class="upload-btn secondary" onclick="document.getElementById('fileInput').click()">
      <span class="icon">📄</span> Upload a File
    </button>
  </div>

  <div id="scanReview" style="display:none;">
    <h2 class="section">Pages Captured (<span id="pageCount">0</span>)</h2>
    <div id="pageThumbs" style="display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;"></div>
    <p style="font-size:12px;color:#888;margin:0 0 12px;">More pages to this contract? Tap a button above to add another, or Analyze when you're done.</p>
    <button class="upload-btn primary" id="analyzeBtn" onclick="analyzeAllPages()">
      ✅ Analyze <span id="analyzeCount"></span> →
    </button>
    <button class="upload-btn secondary" onclick="cancelScan()">Cancel</button>
  </div>

  <!-- capture="environment" sends the browser straight into the camera app,
       no chooser dialog in between -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="onPagePicked(this)" />

  <!-- accept=image/* with no capture attribute opens the photo library/gallery directly -->
  <input type="file" id="galleryInput" accept="image/*" onchange="onPagePicked(this)" />

  <!-- Dedicated document input for PDFs, Word docs, spellbooks, text files -->
  <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.spellbook,.txt" onchange="handleUpload(this)" />

  <p class="status-msg" id="statusMsg"></p>

  <h2 class="section">Your Files</h2>
  <div id="fileList"></div>
  <p class="empty" id="emptyMsg" style="display:none;">No files yet. Scan a contract or upload a document above to get started.</p>

<script>
function setStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg || '';
  el.className = 'status-msg' + (isError ? ' error' : '');
}

async function loadFiles() {
  const res = await fetch('/api/vault/files');
  if (res.status === 401) {
    document.body.innerHTML = '<p class="login-msg">Please <a href="/login">log in</a> to view your Vault.</p>';
    return;
  }
  const data = await res.json();
  const list = document.getElementById('fileList');
  const emptyMsg = document.getElementById('emptyMsg');
  list.innerHTML = '';
  const files = data.files || [];
  emptyMsg.style.display = files.length ? 'none' : 'block';

  files.forEach(f => {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.innerHTML = `
      <div class="top-row">
        <span class="file-name">${escapeHtml(f.original_name)}</span>
        <span class="type-tag">${escapeHtml(f.type)}</span>
      </div>
      <div class="meta-row">${(f.size/1024).toFixed(1)} KB · ${new Date(f.created_at).toLocaleDateString()}</div>
      <div class="action-row">
        <button class="download-btn" onclick="downloadFile(${f.id})">Download</button>
        <button class="danger" onclick="deleteFile(${f.id})">Delete</button>
      </div>`;
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function handleUpload(input) {
  if (!input.files.length) return;
  await uploadDocumentFile(input.files[0]);
  input.value = '';
}

async function uploadDocumentFile(file) {
  setStatus('Uploading ' + file.name + '...');
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/vault/upload', { method: 'POST', body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      setStatus(err.error || 'Upload failed', true);
    } else {
      setStatus('Uploaded ' + file.name);
      loadFiles();
    }
  } catch (e) {
    setStatus('Upload failed — check your connection', true);
  }
}

// ── MULTI-PAGE SCAN QUEUE ──
let scanPages = []; // File objects, in the order the user captured them

function onPagePicked(input) {
  if (!input.files.length) return;
  scanPages.push(input.files[0]);
  input.value = ''; // reset so picking the same photo twice still fires onchange
  renderScanReview();
}

function renderScanReview() {
  const review = document.getElementById('scanReview');
  const thumbs = document.getElementById('pageThumbs');
  const count = document.getElementById('pageCount');
  const analyzeCount = document.getElementById('analyzeCount');

  if (!scanPages.length) {
    review.style.display = 'none';
    document.getElementById('takePhotoBtn').innerHTML = '<span class="icon">📷</span> Take Photo';
    document.getElementById('galleryBtn').innerHTML = '<span class="icon">🖼️</span> Choose from Gallery';
    return;
  }

  review.style.display = 'block';
  count.textContent = scanPages.length;
  analyzeCount.textContent = scanPages.length + (scanPages.length === 1 ? ' Page' : ' Pages');
  document.getElementById('takePhotoBtn').innerHTML = '<span class="icon">📷</span> Add Another Page';
  document.getElementById('galleryBtn').innerHTML = '<span class="icon">🖼️</span> Add from Gallery';

  thumbs.innerHTML = '';
  scanPages.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;flex-shrink:0;';
    wrap.innerHTML = `
      <img src="${url}" style="width:72px;height:92px;object-fit:cover;border-radius:8px;border:1px solid #333;">
      <button onclick="removeScanPage(${i})" style="position:absolute;top:-6px;right:-6px;background:#3a1a1e;color:#ff8b8b;border:1px solid #5a2a2e;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer;">×</button>
      <div style="text-align:center;font-size:10px;color:#888;margin-top:3px;">Page ${i + 1}</div>
    `;
    thumbs.appendChild(wrap);
  });
}

function removeScanPage(i) {
  scanPages.splice(i, 1);
  renderScanReview();
}

function cancelScan() {
  scanPages = [];
  renderScanReview();
  setStatus('');
}

async function analyzeAllPages() {
  if (!scanPages.length) return;
  const analyzeBtn = document.getElementById('analyzeBtn');
  analyzeBtn.disabled = true;
  const extractedTexts = [];
  try {
    for (let i = 0; i < scanPages.length; i++) {
      const file = scanPages[i];
      setStatus(`Uploading page ${i + 1} of ${scanPages.length}...`);
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch('/api/vault/upload', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus(`Page ${i + 1} failed to upload: ` + (err.error || 'unknown error'), true);
        analyzeBtn.disabled = false;
        return;
      }
      const data = await res.json();

      setStatus(`Reading page ${i + 1} of ${scanPages.length}...`);
      const extractRes = await fetch('/api/vault/extract/' + data.file.id);
      const extractData = await extractRes.json();
      if (extractData.error) {
        setStatus(`Page ${i + 1} could not be read: ` + extractData.error, true);
        analyzeBtn.disabled = false;
        return;
      }
      extractedTexts.push(`--- Page ${i + 1} ---\n` + extractData.text);
    }

    const combinedText = extractedTexts.join('\n\n');
    const pageWord = scanPages.length === 1 ? 'page' : 'pages';
    sessionStorage.setItem('lexai_scan_result', JSON.stringify({
      text: combinedText,
      filename: `Scanned document (${scanPages.length} ${pageWord})`
    }));

    setStatus('Opening analysis...');
    scanPages = [];
    window.location.href = '/dashboard.html';
  } catch (e) {
    setStatus('Something went wrong — check your connection', true);
    analyzeBtn.disabled = false;
  }
}

function downloadFile(id) {
  window.location.href = `/api/vault/download/${id}`;
}

async function deleteFile(id) {
  if (!confirm('Delete this file?')) return;
  await fetch(`/api/vault/${id}`, { method: 'DELETE' });
  loadFiles();
}

// ── DRAG AND DROP (desktop/laptop, and iPad drag-between-apps) ──
// Phones have no real drag source for this — photos live inside an app,
// not on a desktop — so this is an extra path for larger screens, not
// a replacement for the camera/gallery buttons above.
let dragCounter = 0;

document.body.addEventListener('dragenter', e => {
  e.preventDefault();
  dragCounter++;
  document.body.classList.add('drag-over');
});

document.body.addEventListener('dragover', e => {
  e.preventDefault(); // required to allow drop
});

document.body.addEventListener('dragleave', e => {
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    document.body.classList.remove('drag-over');
  }
});

document.body.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  document.body.classList.remove('drag-over');

  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;

  let addedPages = false;
  files.forEach(file => {
    if (file.type.startsWith('image/')) {
      scanPages.push(file);
      addedPages = true;
    } else {
      uploadDocumentFile(file);
    }
  });
  if (addedPages) renderScanReview();
});

loadFiles();
</script>
</body>
</html>
