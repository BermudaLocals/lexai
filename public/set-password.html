<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Set your password — LexAI.llc</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--s:#0f0f12;--border:rgba(212,175,55,.1);--gold:#d4af37;--gold2:#f0d060;--text:#ece9e0;--muted:#7a766c;--serif:'Playfair Display',serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--s);border:1px solid var(--border);border-radius:12px;padding:44px 40px;width:100%;max-width:420px}
.logo{font-family:var(--serif);font-size:26px;font-weight:900;color:#fff;text-align:center;margin-bottom:4px;text-decoration:none;display:block}
.logo span{color:var(--gold)}
.tagline{text-align:center;font-size:12px;color:var(--muted);margin-bottom:36px;font-family:var(--mono)}
.msg{font-size:12px;text-align:center;padding:10px;border-radius:6px;margin-bottom:16px;display:none;font-family:var(--mono)}
.msg.ok{background:rgba(212,175,55,.08);color:var(--gold);border:1px solid var(--border)}
.msg.err{background:rgba(239,68,68,.08);color:#f87171;border:1px solid rgba(239,68,68,.15)}
label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
input[type=password]{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:6px;color:var(--text);font-size:13px;padding:11px 13px;outline:none;font-family:var(--sans);transition:border-color .15s;margin-bottom:14px}
input[type=password]:focus{border-color:var(--gold)}
.submit{width:100%;background:var(--gold);color:#070709;border:none;border-radius:7px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.submit:hover{background:var(--gold2)}
.submit:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo">LexAI<span>.llc</span></a>
  <div class="tagline">Your purchase is active — set a password to finish</div>
  <div id="msg" class="msg"></div>
  <form id="pwForm" onsubmit="sendPassword(event)">
    <label>New password (min 8 characters)</label>
    <input type="password" id="password" placeholder="New password" minlength="8" required>
    <label>Confirm password</label>
    <input type="password" id="confirm" placeholder="Repeat password" minlength="8" required>
    <button type="submit" class="submit" id="btn">Save &amp; continue</button>
  </form>
</div>
<script>
// Session token arrives via ?token= (same convention as the OAuth callback)
const _p = new URLSearchParams(location.search);
const _t = _p.get('token');
if (_t) { localStorage.setItem('lexai_token', _t); window.history.replaceState({}, document.title, '/set-password'); }
async function sendPassword(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.style.display = 'block';
  if (password !== confirm) {
    msg.className = 'msg err';
    msg.textContent = 'Passwords do not match';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const r = await fetch('/auth/set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('lexai_token') || '') },
      body: JSON.stringify({ password })
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = 'msg ok';
      msg.textContent = '✓ Password saved! Redirecting...';
      setTimeout(() => { window.location.href = d.redirect || '/dashboard'; }, 1200);
    } else {
      msg.className = 'msg err';
      msg.textContent = d.error || 'Failed to save password';
      btn.disabled = false;
      btn.textContent = 'Save & continue';
    }
  } catch {
    msg.className = 'msg err';
    msg.textContent = 'Network error';
    btn.disabled = false;
    btn.textContent = 'Save & continue';
  }
}
</script>
</body>
</html>
